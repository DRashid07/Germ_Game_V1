<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" width="64" height="32">
  <!-- Uçan top — KOMET. Baş sağdadır (46, 16), quyruq sola uzanır; kodda sprite
       uçuş istiqamətinə döndərilir və `offset` başı node-un nöqtəsinə qoyur
       (bax Arena.SHOT_HEAD). Sprite AĞ-BOZDUR: rəngi `modulate` ilə sahibinin
       rənginə boyanır, 10 rəng üçün TƏK tekstura — hamısı bir çəkiliş çağırışında.
       Baş köhnə shot_ball.svg ilə eyni ölçüdədir (r 9.6, tünd haşiyə r 11):
       topun toqquşma radiusu dəyişməyib. Parıltı nöqtəsi mərkəzdədir, yuxarı-solda
       deyil — sprite fırlanır və yan işıq hər istiqamətdə başqa yerə düşərdi. -->
  <defs>
    <linearGradient id="tail" x1="2" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="55%" stop-color="#E8F4F2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="head" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#EEF7F5"/>
      <stop offset="100%" stop-color="#9DB4B1"/>
    </radialGradient>
  </defs>
  <circle cx="46" cy="16" r="14.5" fill="#FFFFFF" opacity="0.14"/>
  <path d="M 2 16 C 14 13.2, 30 7.6, 46 7 L 46 25 C 30 24.4, 14 18.8, 2 16 Z" fill="url(#tail)"/>
  <circle cx="46" cy="16" r="11" fill="#04090B" opacity="0.6"/>
  <circle cx="46" cy="16" r="9.6" fill="url(#head)"/>
  <circle cx="47.5" cy="16" r="3.2" fill="#FFFFFF" opacity="0.85"/>
</svg>
