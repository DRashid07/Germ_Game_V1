<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <!-- Loqonun NİŞAN hissəsi. Söz nişanı ("GERM ARENA") burada YOXDUR:
       Godot SVG-ni ThorVG ilə rasterləşdirir, ThorVG isə <text> elementlərini
       sükutla atır. Yazı main_menu.gd → _make_logo() içində Label ilə əlavə olunur. -->
  <defs>
    <radialGradient id="body" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#7CFF5B"/>
      <stop offset="60%" stop-color="#3FBF57"/>
      <stop offset="100%" stop-color="#14512E"/>
    </radialGradient>
  </defs>

  <!-- Petri qabının kəsiyi -->
  <circle cx="108" cy="110" r="92" fill="#0C1A1E" stroke="#1E4650" stroke-width="5"/>
  <circle cx="108" cy="110" r="74" fill="none" stroke="#2FE8E0" stroke-width="2" opacity="0.25"/>

  <!-- Mikrob: membran + içindəki toplar -->
  <circle cx="108" cy="110" r="58" fill="url(#body)" opacity="0.9"/>
  <circle cx="108" cy="110" r="58" fill="none" stroke="#D6FFC9" stroke-width="4" opacity="0.85"/>
  <g fill="#EAFBF6">
    <circle cx="92" cy="96" r="11" opacity="0.95"/>
    <circle cx="125" cy="102" r="9" opacity="0.85"/>
    <circle cx="100" cy="128" r="10" opacity="0.9"/>
    <circle cx="127" cy="131" r="7.5" opacity="0.8"/>
    <circle cx="112" cy="112" r="6" opacity="0.7"/>
  </g>

  <!-- Sağ tərəfdə partlayan rəqib -->
  <g opacity="0.75">
    <circle cx="520" cy="150" r="38" fill="none" stroke="#FF5BC8" stroke-width="5"/>
    <g fill="#FF5BC8">
      <circle cx="520" cy="104" r="7"/>
      <circle cx="556" cy="124" r="6"/>
      <circle cx="562" cy="168" r="5.5"/>
      <circle cx="520" cy="192" r="6.5"/>
      <circle cx="480" cy="170" r="5"/>
      <circle cx="478" cy="122" r="6"/>
    </g>
  </g>
</svg>
