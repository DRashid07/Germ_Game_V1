<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- BLOKLAYAN SELİK — kölgə + tünd yan üz + işıqlı üst üz eyni sprite-dadır.
       Xarici gövdə r=120 və mərkəzi (160,160) olaraq qalır: görünən sərhəd
       toqquşma dairəsindən kənara çıxmır. Üst üz yuxarı-sola 22% hündürlük
       hissi verəcək qədər qalxır, amma baza dairəsi silueti qoruyur. -->
  <defs>
    <radialGradient id="castShadow" cx="46%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#020608" stop-opacity="0.48"/>
      <stop offset="58%" stop-color="#020608" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contactShadow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#020608" stop-opacity="0.44"/>
      <stop offset="68%" stop-color="#020608" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#020608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="25%" y1="18%" x2="78%" y2="100%">
      <stop offset="0%" stop-color="#1B4650"/>
      <stop offset="48%" stop-color="#102C34"/>
      <stop offset="100%" stop-color="#07161B"/>
    </linearGradient>
    <radialGradient id="top" cx="34%" cy="27%" r="76%">
      <stop offset="0%" stop-color="#397381"/>
      <stop offset="48%" stop-color="#25515D"/>
      <stop offset="100%" stop-color="#15333C"/>
    </radialGradient>
    <clipPath id="bodyClip"><circle cx="160" cy="160" r="120"/></clipPath>
    <clipPath id="topClip"><ellipse cx="151" cy="145" rx="108" ry="106"/></clipPath>
  </defs>

  <!-- Kölgə -LIGHT_DIR = aşağı-sağ istiqamətindədir. Yumşaq geniş qat hündürlüyü,
       sıx ellips isə döşəməyə təması göstərir; əlavə draw çağırışı yoxdur. -->
  <ellipse cx="176" cy="192" rx="132" ry="111" fill="url(#castShadow)"/>
  <ellipse cx="171" cy="182" rx="117" ry="101" fill="url(#contactShadow)"/>

  <!-- Yan üz bütöv toqquşma siluetidir. Aşağı-sağa doğru tündləşməsi divarı
       yastı ləkədən ayırır; düz künc yox, qalın selik damcısı kimi qalır. -->
  <circle cx="160" cy="160" r="120" fill="url(#side)" stroke="#081A20" stroke-width="5"/>
  <g clip-path="url(#bodyClip)">
    <path d="M45 154 C62 222 111 272 183 278 C228 282 264 260 282 221 L282 282 L38 282Z" fill="#061217" opacity="0.34"/>
    <path d="M52 126 C66 82 103 50 148 41" fill="none" stroke="#3F7F8D" stroke-width="5" stroke-linecap="round" opacity="0.42"/>
  </g>

  <!-- Üst üz siluetin daxilində yuxarı-sola oturur; sağ-alt tərəfdə 26 px-ə
       yaxın yan bant açıq qalır. -->
  <ellipse cx="151" cy="145" rx="108" ry="106" fill="url(#top)" stroke="#2E6571" stroke-width="5"/>
  <g clip-path="url(#topClip)">
    <g fill="#4A8490" opacity="0.31">
      <circle cx="105" cy="105" r="15"/><circle cx="171" cy="119" r="11"/>
      <circle cx="123" cy="163" r="13"/><circle cx="180" cy="176" r="8"/>
      <circle cx="82" cy="149" r="7"/>
    </g>
    <g fill="#0D2931" opacity="0.42">
      <circle cx="111" cy="112" r="7"/><circle cx="176" cy="124" r="5"/>
      <circle cx="129" cy="170" r="6"/>
    </g>
    <ellipse cx="111" cy="87" rx="38" ry="21" fill="#76B2BE" opacity="0.17" transform="rotate(-24 111 87)"/>
  </g>
  <!-- İşıq qövsü yalnız yuxarı-sol tərəfdədir; tam haşiyə səthi yenə yastı edərdi. -->
  <path d="M62 141 C67 85 104 48 161 40 C190 36 214 43 232 54" fill="none" stroke="#78B8C4" stroke-width="7" stroke-linecap="round" opacity="0.58"/>
</svg>
