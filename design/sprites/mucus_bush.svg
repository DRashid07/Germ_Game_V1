<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- KOLUN BAZASI — keçilən sahə olduğu üçün QƏSDƏN yastıdır: düşən kölgə və
       yan üz yoxdur. Hündürlük əvəzinə doymuş yaşıl, seyrək iç və kəsik frond
       silueti onu döşəmədən ayırır. Xarici ölçü yenə r=120-dir. -->
  <defs>
    <radialGradient id="bush" cx="40%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#55D879" stop-opacity="0.84"/>
      <stop offset="52%" stop-color="#299E58" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#126035" stop-opacity="0.35"/>
    </radialGradient>
    <clipPath id="bushClip"><circle cx="160" cy="160" r="120"/></clipPath>
  </defs>
  <circle cx="160" cy="160" r="111" fill="url(#bush)"/>
  <!-- Bütöv haşiyə yoxdur: ayrı yarpaq kökləri "buradan keçmək olar" deyir. -->
  <g stroke="#42C96B" stroke-width="8" stroke-linecap="round" opacity="0.86">
    <path d="M160 42 L160 77"/><path d="M196 48 L184 82"/>
    <path d="M229 68 L207 96"/><path d="M252 98 L220 114"/>
    <path d="M274 132 L237 139"/><path d="M276 169 L239 165"/>
    <path d="M263 205 L228 191"/><path d="M239 237 L211 211"/>
    <path d="M205 260 L188 225"/><path d="M168 278 L165 239"/>
    <path d="M130 274 L139 237"/><path d="M94 260 L112 225"/>
    <path d="M62 236 L89 210"/><path d="M40 203 L74 190"/>
    <path d="M43 132 L79 140"/><path d="M55 96 L88 114"/>
    <path d="M82 67 L106 96"/><path d="M122 47 L135 82"/>
  </g>
  <g clip-path="url(#bushClip)">
    <!-- İri yarpaqların arasındakı boşluq döşəməni göstərir; dolu disk sınansa
         mikrob kolun içində yox, yaşıl divarın altında itirdi. -->
    <g fill="#2CB864" opacity="0.62">
      <ellipse cx="115" cy="108" rx="35" ry="20" transform="rotate(-28 115 108)"/>
      <ellipse cx="185" cy="111" rx="34" ry="19" transform="rotate(22 185 111)"/>
      <ellipse cx="145" cy="151" rx="39" ry="22" transform="rotate(7 145 151)"/>
      <ellipse cx="202" cy="169" rx="31" ry="18" transform="rotate(-18 202 169)"/>
      <ellipse cx="96" cy="177" rx="30" ry="17" transform="rotate(29 96 177)"/>
      <ellipse cx="151" cy="213" rx="35" ry="19" transform="rotate(-8 151 213)"/>
      <ellipse cx="218" cy="129" rx="23" ry="14" transform="rotate(37 218 129)"/>
      <ellipse cx="78" cy="137" rx="23" ry="14" transform="rotate(-37 78 137)"/>
    </g>
    <g fill="#8AF2A5" opacity="0.30">
      <ellipse cx="106" cy="99" rx="23" ry="8" transform="rotate(-28 106 99)"/>
      <ellipse cx="178" cy="102" rx="22" ry="8" transform="rotate(22 178 102)"/>
      <ellipse cx="136" cy="141" rx="25" ry="8" transform="rotate(7 136 141)"/>
      <ellipse cx="91" cy="168" rx="18" ry="6" transform="rotate(29 91 168)"/>
    </g>
    <g fill="#0D4B2B" opacity="0.36">
      <ellipse cx="130" cy="124" rx="17" ry="10"/><ellipse cx="179" cy="150" rx="19" ry="11"/>
      <ellipse cx="122" cy="193" rx="18" ry="10"/><ellipse cx="207" cy="196" rx="15" ry="9"/>
    </g>
  </g>
</svg>
