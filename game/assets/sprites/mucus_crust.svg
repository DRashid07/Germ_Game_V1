<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- KÖVRƏK QABIQ — 0 zərbə. Seliklə eyni r=120 üç üzlü həcmə malikdir,
       amma üst üz quru, bucaqlı və kəhrəba damarlı görünür. Bu ilk mərhələdə
       çat az və dardır; sonrakı sprite-lar yalnız xətt enini yox, topologiyanı
       və qopmuş kənarı da dəyişir. -->
  <defs>
    <radialGradient id="castShadow" cx="46%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#020608" stop-opacity="0.50"/>
      <stop offset="60%" stop-color="#020608" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#020608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contactShadow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#020608" stop-opacity="0.46"/>
      <stop offset="68%" stop-color="#020608" stop-opacity="0.31"/>
      <stop offset="100%" stop-color="#020608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="24%" y1="18%" x2="78%" y2="100%">
      <stop offset="0%" stop-color="#3D443E"/>
      <stop offset="48%" stop-color="#262E2E"/>
      <stop offset="100%" stop-color="#10191B"/>
    </linearGradient>
    <radialGradient id="top" cx="34%" cy="27%" r="76%">
      <stop offset="0%" stop-color="#596963"/>
      <stop offset="46%" stop-color="#3D514F"/>
      <stop offset="100%" stop-color="#243A3C"/>
    </radialGradient>
    <clipPath id="bodyClip"><circle cx="160" cy="160" r="120"/></clipPath>
    <clipPath id="topClip"><ellipse cx="151" cy="145" rx="108" ry="106"/></clipPath>
  </defs>
  <ellipse cx="176" cy="192" rx="132" ry="111" fill="url(#castShadow)"/>
  <ellipse cx="171" cy="182" rx="117" ry="101" fill="url(#contactShadow)"/>
  <circle cx="160" cy="160" r="120" fill="url(#side)" stroke="#0A1517" stroke-width="5"/>
  <g clip-path="url(#bodyClip)">
    <path d="M45 154 C62 222 111 272 183 278 C228 282 264 260 282 221 L282 282 L38 282Z" fill="#0A1113" opacity="0.38"/>
    <path d="M52 126 C66 82 103 50 148 41" fill="none" stroke="#73837A" stroke-width="5" stroke-linecap="round" opacity="0.40"/>
  </g>
  <ellipse cx="151" cy="145" rx="108" ry="106" fill="url(#top)" stroke="#657770" stroke-width="5"/>
  <g clip-path="url(#topClip)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Üç əsas yarıq hələ bir-birinə az bağlanır: divar sağlam oxunur. -->
    <g stroke="#171C1C" stroke-width="7" opacity="0.92">
      <path d="M151 47 L145 91 L160 119 L151 153 L160 213"/>
      <path d="M57 123 L101 119 L145 91"/>
      <path d="M244 146 L198 139 L160 119"/>
      <path d="M93 220 L124 172 L151 153"/>
    </g>
    <g stroke="#D09345" stroke-width="2.5" opacity="0.82">
      <path d="M148 47 L142 91 L157 119 L148 153 L157 213"/>
      <path d="M57 120 L101 116 L142 91"/>
      <path d="M244 143 L198 136 L157 119"/>
    </g>
  </g>
  <g fill="#71817A" opacity="0.24">
    <circle cx="108" cy="146" r="8"/><circle cx="179" cy="95" r="6"/><circle cx="192" cy="181" r="6"/>
  </g>
  <path d="M62 141 C67 85 104 48 161 40 C190 36 214 43 232 54" fill="none" stroke="#A7B8AD" stroke-width="6" stroke-linecap="round" opacity="0.48"/>
</svg>
