<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- QABIN DÖŞƏMƏSİ — çökən səth, TƏK teksturada.
       Əvvəl 14 konsentrik `draw_circle` ilə çəkilirdi və ölçmə göstərdi ki,
       hər biri AYRICA çəkiliş çağırışıdır: yalnız döşəmə 14 çağırış yeyirdi.
       Qradiyent teksturada isə bir `draw_texture_rect` bəs edir.
       Kodda `2 * WORLD_RADIUS` ölçüsünə uzadılır. -->
  <defs>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0E1F25"/>
      <stop offset="45%"  stop-color="#0C1A1E"/>
      <stop offset="78%"  stop-color="#0A161A"/>
      <stop offset="100%" stop-color="#071012"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#floor)"/>
</svg>
