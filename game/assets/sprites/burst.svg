<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Partlayış buludu — dağılan sitoplazma.
       Ağdır: kodda partlayan mikrobun rənginə boyanır ([BurstFx._draw_mist]).

       Bu şəkil YALNIZ yumşaq bulud verir. Halqalar, damcılar və cırılan
       membran parçaları kodla çəkilir, çünki onların sayı və sürəti
       partlayan mikrobun ölçüsündən asılıdır. Əvvəlki versiyada burada
       kəskin kənarlı nöqtə halqası vardı — kodla çəkilən damcılarla
       üst-üstə düşüb "diş çarxı" kimi oxunurdu. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="30%"  stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="62%"  stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Buludun qeyri-bərabər ləçəkləri: mərkəzdən uzaqlaşdıqca sönür,
         ona görə kənarı heç bir yerdə kəsilmir. -->
    <radialGradient id="lobe" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="128" cy="128" r="126" fill="url(#core)"/>

  <!-- Ləçəklər həm ÖLÇÜ, həm MƏSAFƏ, həm SAY baxımından qeyri-bərabərdir.
       Bərabər düzülmüş səkkiz ləçək sınandı və atıldı: böyük mikrobun
       partlayışında onlar ayrı-ayrı seçilib "çiçək" kimi oxunurdu.
       Üç fərqli məsafədə on bir ləçək isə heç bir nizam vermir. -->
  <g>
    <ellipse cx="128" cy="66"  rx="42" ry="50" fill="url(#lobe)"/>
    <ellipse cx="176" cy="88"  rx="30" ry="26" fill="url(#lobe)"/>
    <ellipse cx="196" cy="140" rx="44" ry="36" fill="url(#lobe)"/>
    <ellipse cx="162" cy="180" rx="24" ry="30" fill="url(#lobe)"/>
    <ellipse cx="122" cy="196" rx="40" ry="46" fill="url(#lobe)"/>
    <ellipse cx="80"  cy="172" rx="26" ry="22" fill="url(#lobe)"/>
    <ellipse cx="54"  cy="126" rx="38" ry="42" fill="url(#lobe)"/>
    <ellipse cx="86"  cy="80"  rx="22" ry="26" fill="url(#lobe)"/>
    <ellipse cx="104" cy="132" rx="52" ry="44" fill="url(#lobe)"/>
    <ellipse cx="156" cy="118" rx="46" ry="52" fill="url(#lobe)"/>
    <ellipse cx="130" cy="158" rx="48" ry="38" fill="url(#lobe)"/>
  </g>

  <!-- İç nüvə — qopma anının qalıq istiliyi. -->
  <circle cx="128" cy="128" r="46" fill="url(#core)"/>
</svg>
