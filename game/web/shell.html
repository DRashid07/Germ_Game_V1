<!DOCTYPE html>
<html lang="az" translate="no">
	<head>
		<meta charset="utf-8">
		<!-- Brauzer dili başqa olanda Chrome aşağıda "tərcümə et" paneli açır və o, joystik
		     ilə atəş düyməsinin üstünə düşür (Android emulyatorunda görülüb). Oyun kətanda
		     çəkilir — tərcüməyə onsuz da heç nə yoxdur. -->
		<meta name="google" content="notranslate">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="theme-color" content="#071012">
		<!-- Telefonda "ana ekrana əlavə et" ilə açılanda brauzer paneli olmadan tam ekran. -->
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	background-color: #071012;
	color: white;
	overflow: hidden;
	/* Oyun toxunuşla idarə olunur: sürüşdürmə, yaxınlaşdırma və "aşağı dartıb yenilə" söndürülür. */
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

body {
	display: flex;
	align-items: center;
	justify-content: center;
}

#canvas {
	display: block;
	touch-action: none;
	/* Ölçünü aşağıdakı `fitCanvas` təyin edir — CSS burada yalnız kadrı mərkəzləyir. */
}

#canvas:focus {
	outline: none;
}

/* Portret örtüyü.
   `window/handheld/orientation = 0` telefonu YALNIZ APK-da kilidləyir.
   Brauzerdə kilidləmək olmur: `screen.orientation.lock()` yalnız tam ekran
   rejimində və yalnız bəzi mobil brauzerlərdə işləyir. Oyun isə yalnız
   yatay oynanır, ona görə portret pəncərədə kadrı sıxmaq əvəzinə oyunçudan
   telefonu çevirməsi istənilir. Yükləmə arxada davam edir — örtük yalnız
   üstdən çəkilən qatdır. */
#rotate {
	position: absolute;
	inset: 0;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 1.25rem;
	background-color: #071012;
	color: #EAFBF6;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	text-align: center;
	z-index: 2;
}

#rotate.show {
	display: flex;
}

#rotate svg {
	width: 84px;
	height: 84px;
	animation: rotate-hint 2.4s ease-in-out infinite;
}

#rotate p {
	margin: 0;
	font-size: 1.15rem;
}

#rotate small {
	color: #7FA0A0;
	font-size: 0.9rem;
}

@keyframes rotate-hint {
	0%, 34% { transform: rotate(0deg); }
	62%, 100% { transform: rotate(-90deg); }
}

@media (prefers-reduced-motion: reduce) {
	#rotate svg { animation: none; transform: rotate(-90deg); }
}

/* "Oyun hazırlanır" — yükləmə bitəndən menyunun İLK kadrına qədər.
   Zəif telefonda (Galaxy A04s sinfi) bu ara 20+ saniyədir: mühərrik shader-ləri
   tərcümə edir, menyu qurulur və əsas axın bütün bu müddətdə məşğuldur. Əvvəl
   ekranda dolu tərəqqi zolağı donub qalırdı və oyun "dondu" sanılırdı. Nöqtələr
   yalnız `transform`/`opacity` ilə oynayır — bunu brauzerin kompozitoru çəkir,
   yəni əsas axın məşğul olanda da hərəkət edirlər. */
#status-prep {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 8%;
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 0.45rem;
	color: #EAFBF6;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	text-align: center;
}

#status-prep p {
	margin: 0;
	font-size: 1.05rem;
}

#status-prep small {
	color: #7FA0A0;
	font-size: 0.85rem;
}

#status-prep .dots {
	display: flex;
	gap: 10px;
}

#status-prep .dots i {
	width: 11px;
	height: 11px;
	border-radius: 50%;
	background-color: #7CFF5B;
	animation: prep-pulse 1.1s ease-in-out infinite;
	will-change: transform, opacity;
}

#status-prep .dots i:nth-child(2) { animation-delay: 0.18s; }
#status-prep .dots i:nth-child(3) { animation-delay: 0.36s; }

@keyframes prep-pulse {
	0%, 80%, 100% { transform: scale(0.55); opacity: 0.4; }
	40% { transform: scale(1); opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
	#status-prep .dots i { animation: none; opacity: 0.8; }
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

/* Telefonda yazı pəncərəsi (bax aşağıdakı `germText` və game/scripts/client/web_text.gd).
   Kətanın üstündə həqiqi <input> — iOS klaviaturanı yalnız toxunuşun İÇİNDƏ fokuslanan
   HTML sahəsi üçün açır. Kart ekranın YUXARISINDADIR: yatay telefonda klaviatura
   ekranın yarıdan çoxunu örtür. Ölçü və yer `visualViewport`-dan gəlir (bax `fitToViewport`). */
#text-entry {
	position: fixed;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
	display: none;
	align-items: flex-start;
	justify-content: center;
	padding-top: max(12px, env(safe-area-inset-top));
	box-sizing: border-box;
	background-color: rgba(2, 7, 8, 0.72);
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
	z-index: 10;
}

#text-entry.show {
	display: flex;
}

#text-entry .te-card {
	width: min(560px, calc(100% - 32px));
	box-sizing: border-box;
	padding: 12px 14px 14px;
	border-radius: 16px;
	background-color: #0E3346;
	border: 3px solid #04090B;
	box-shadow: 0 5px 0 #04090B;
}

#text-entry .te-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	margin-bottom: 10px;
}

#text-entry .te-title {
	color: #EAFBF6;
	font-size: 18px;
	font-weight: 800;
	letter-spacing: 0.04em;
}

#text-entry .te-cancel {
	flex: none;
	width: 40px;
	height: 40px;
	border: 3px solid #04090B;
	border-radius: 10px;
	background-color: #1F3D45;
	color: #EAFBF6;
	font-size: 20px;
	font-weight: 800;
	line-height: 1;
	cursor: pointer;
}

#text-entry form {
	display: flex;
	gap: 10px;
	margin: 0;
}

#text-entry input {
	flex: 1;
	min-width: 0;
	height: 50px;
	box-sizing: border-box;
	padding: 0 14px;
	border: 3px solid #2FE8E0;
	border-radius: 12px;
	background-color: #071012;
	color: #EAFBF6;
	/* 16 px-dən kiçik şriftdə iOS fokusda səhifəni yaxınlaşdırır. */
	font-size: 22px;
	font-weight: 700;
	outline: none;
	-webkit-user-select: text;
	user-select: text;
	-webkit-touch-callout: default;
	touch-action: manipulation;
}

#text-entry input::placeholder {
	color: #7FA0A0;
	font-weight: 600;
}

#text-entry .te-ok {
	flex: none;
	min-width: 96px;
	height: 50px;
	padding: 0 16px;
	border: 3px solid #04090B;
	border-radius: 12px;
	background-color: #52E08A;
	color: #04090B;
	font-size: 18px;
	font-weight: 800;
	cursor: pointer;
}

#text-entry .te-hint {
	margin-top: 8px;
	color: #7FA0A0;
	font-size: 14px;
	min-height: 1em;
}

/* Yığcam: yatay telefonda klaviatura açılanda görünən hissə 60–130 CSS px qalır
   (emulyatorda ölçülüb: 71 px). Başlıq və izah gizlənir, sahə + GÖNDƏR + ✕ bir
   sətirdə, ən yuxarıda durur — yoxsa sahə klaviaturanın altında qalırdı. */
#text-entry.compact {
	padding-top: 2px;
}

#text-entry.compact .te-card {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 5px 8px;
	border-width: 2px;
	box-shadow: none;
}

#text-entry.compact form {
	flex: 1;
	min-width: 0;
}

#text-entry.compact .te-head {
	order: 2;
	margin: 0;
}

#text-entry.compact .te-title,
#text-entry.compact .te-hint {
	display: none;
}

#text-entry.compact input,
#text-entry.compact .te-ok,
#text-entry.compact .te-cancel {
	height: 44px;
}

#text-entry.compact .te-cancel {
	width: 44px;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Brauzeriniz canvas elementini dəstəkləmir.
		</canvas>

		<noscript>
			Brauzeriniz JavaScript-i dəstəkləmir.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-prep" role="status">
				<div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
				<p>Oyun hazırlanır…</p>
				<small>Zəif telefonda bu, yarım dəqiqəyə qədər çəkə bilər</small>
			</div>
			<div id="status-notice"></div>
		</div>

		<div id="rotate">
			<svg viewBox="0 0 48 48" fill="none" stroke="#7CFF5B" stroke-width="2.4"
					stroke-linejoin="round" aria-hidden="true">
				<rect x="15" y="4" width="18" height="40" rx="3"></rect>
				<line x1="21" y1="9" x2="27" y2="9" stroke-linecap="round"></line>
			</svg>
			<p>Telefonu yan çevir</p>
			<small>Germ Arena yalnız yatay oynanır</small>
		</div>

		<div id="text-entry" role="dialog" aria-modal="true">
			<div class="te-card">
				<div class="te-head">
					<div class="te-title"></div>
					<button type="button" class="te-cancel" aria-label="Bağla">✕</button>
				</div>
				<form>
					<input type="text" autocomplete="off" autocorrect="off" spellcheck="false">
					<button type="submit" class="te-ok">OK</button>
				</form>
				<div class="te-hint"></div>
			</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// ---------------------------------------------------------------------------
// Kadr ölçüsü
//
// `canvasResizePolicy` 0-dır (bax: export presetindəki html/canvas_resize_policy),
// yəni canvas-ın ölçüsünü mühərrik deyil, biz təyin edirik; Godot isə hər kadr
// canvas.width/height-i oxuyub pəncərə ölçüsü kimi qəbul edir.
//
// Məqsəd: yatay tutulan telefonda ekranı tam doldurmaq (APK ilə eyni görüntü),
// masaüstündə isə hündür pəncərədə oyunu 16:9-da, mərkəzdə saxlamaq.
//
// Nisbət eni yox, HÜNDÜRLÜYÜ məhdudlaşdırır: yatay telefon adətən 16:9-dan
// ENLİDİR (20:9 və s.) və o artıq en kadra qatılmalıdır — `stretch/aspect`
// "expand" olduğuna görə oyun həmin əlavə eni özü doldurur.
// ---------------------------------------------------------------------------
const MIN_ASPECT = 1280 / 720;   // 16:9 — kadr bundan DAR (hündür) verilmir
const MAX_DPR = 2;               // çox sıx ekranlarda doldurma yükünü saxlamaq üçün
// Oyun bu həddi özü ENDİRİR — MİNİMUM qrafikada (bax Settings._apply_render_scale).
// Kətan kiçik olur, ekrana böyütməni isə brauzerin kompozitoru pulsuz edir: o,
// kətanı onsuz da ekrana köçürür. Ölçülüb (SwiftShader, doldurmaya həssas GPU
// modeli): DPR 2 → 1.25 kadrın işini 27–30 ms-dən 8–13 ms-ə endirir.
let maxDpr = MAX_DPR;
window.germSetMaxDpr = function (v) {
	const next = Math.max(0.5, Math.min(Number(v) || MAX_DPR, MAX_DPR));
	if (next === maxDpr) return;
	maxDpr = next;
	fitCanvas();
};

function fitCanvas() {
	const canvas = document.getElementById('canvas');
	const rotate = document.getElementById('rotate');
	// Portret pəncərə — oyun oynanmır, örtük göstərilir (bax #rotate).
	if (rotate) {
		rotate.classList.toggle('show', window.innerHeight > window.innerWidth);
	}

	const w = window.innerWidth;
	const h = Math.min(window.innerHeight, Math.floor(w / MIN_ASPECT));
	const dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
	canvas.style.width = w + 'px';
	canvas.style.height = h + 'px';
	canvas.width = Math.max(1, Math.floor(w * dpr));
	canvas.height = Math.max(1, Math.floor(h * dpr));
}

fitCanvas();
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', fitCanvas);

// ---------------------------------------------------------------------------
// Kadr həddi — brauzerin kadr ritmi ilə, boş dövrsüz
//
// Godot 4.7-nin thread-siz veb build-ində `Engine.max_fps` kadrlar arasındakı
// boşluğu `usleep` ilə doldurur, emscripten-də isə əsas axında `usleep` BOŞ
// DÖVRDÜR. Ölçülüb (MİNİMUM, 30 kadr): kadrın işi 4.4 ms, requestAnimationFrame
// çağırışı isə 32.8 ms çəkirdi — bir nüvə oyun boyu 100% fırlanırdı. Telefonda bu,
// istilik, batareya və brauzerin öz işinə (GPU prosesi, şəbəkə) qalmayan vaxtdır.
//
// Ona görə oyun brauzerdə `Engine.max_fps`-i 0 saxlayır və həddi bura verir
// (bax Settings._apply_frame_cap). Hədd kadr BURAXMAQLA tətbiq olunur: Godot-un
// kadrı yalnız vaxtı çatanda çağırılır, arada əsas axın boşdur. Faza saxlanılır —
// 60 Hz-də 30 kadr hər İKİNCİ, 90 Hz-də hər ÜÇÜNCÜ vsync-dir, sürüşmür.
// Kadr özü həddən uzun çəkirsə, heç nə buraxılmır.
// ---------------------------------------------------------------------------
let frameCap = 0;
window.germSetFrameCap = function (fps) {
	frameCap = Math.max(0, Math.floor(Number(fps) || 0));
};
(function () {
	const raf = window.requestAnimationFrame.bind(window);
	let last = -1;
	window.requestAnimationFrame = function (callback) {
		return raf(function tick(now) {
			if (frameCap > 0) {
				const interval = 1000 / frameCap;
				// 2 ms ehtiyat: vsync vaxtı tam bərabər gəlmir.
				if (last >= 0 && now - last < interval - 2) {
					raf(tick);
					return;
				}
				last = (last >= 0 && now - last < interval * 1.5) ? last + interval : now;
			} else {
				last = now;
			}
			callback(now);
		});
	};
}());
// Uzun basanda mobil brauzerin kontekst menyusu çıxmasın — nişan alma jesti kəsilir.
// Yazı pəncərəsində isə lazımdır: kodu "Yapışdır" ilə qoymaq olsun.
window.addEventListener('contextmenu', (e) => {
	if (!e.target.closest || !e.target.closest('#text-entry')) {
		e.preventDefault();
	}
});

// ---------------------------------------------------------------------------
// Telefonda yazı sahəsi
//
// Godot telefon brauzerində yazı sahəsi üçün GİZLİ bir elementi 100 ms-dən bir
// `focus()` edir. Android Chrome toxunuşdan sonrakı ~5 s ərzində bunu qəbul edib
// klaviaturanı açır, iOS (Safari və iOS-dakı Chrome — ikisi də WebKit-dir) isə
// klaviaturanı YALNIZ toxunuş hadisəsinin İÇİNDƏ fokuslanan sahə üçün açır. Ona
// görə iPhone-da dost kodu ümumiyyətlə yazıla bilmirdi.
//
// Axın:
//   1. Oyunçu sahəyə toxunur. Godot toxunuşu növbəti kadrda emal edir və
//      `germText.arm(cfg)` çağırır (bax game/scripts/client/web_text.gd).
//   2. Barmaq qalxanda (`touchend` — iOS-un icazə verdiyi an) sahə silahlıdırsa,
//      bu pəncərə açılır və <input> ELƏ HƏMİN hadisədə fokuslanır: klaviatura çıxır.
//   3. GÖNDƏR / Enter — nəticə Godot-a qaytarılır (`take`), ✕ və ya fona toxunmaq — ləğv.
// Kadr çox yavaşdırsa və Godot toxunuşu barmaq qalxandan SONRA emal edirsə, pəncərə
// dərhal açılır; iOS-da klaviatura üçün sahəyə bir dəfə də toxunmaq lazım gəlir.
// ---------------------------------------------------------------------------
window.germText = (function () {
	const canvas = document.getElementById('canvas');
	const root = document.getElementById('text-entry');
	const title = root.querySelector('.te-title');
	const hint = root.querySelector('.te-hint');
	const form = root.querySelector('form');
	const input = root.querySelector('input');
	const ok = root.querySelector('.te-ok');
	const cancel = root.querySelector('.te-cancel');
	// Godot-un silahladığı sahə bu qədər ms gözləyir (toxunuş adətən 50–200 ms, uzun basış 1–2 s).
	const ARM_TTL = 3000;
	// Barmaq bundan çox sürüşübsə, bu toxunuş deyil — sürüşdürmədir.
	const TAP_SLOP = 24;
	let armed = null;
	let touchStart = null;
	let liftedAt = -1e9;
	let current = null;
	let result = null;

	// Klaviatura açılanda layout viewport-u dəyişmir, görünən hissə kiçilir və sürüşür:
	// kart görünən hissənin yuxarısında qalmalıdır. Alçaq olanda kart yığcamlaşır.
	// Yatay telefon (hündürlük < 500) həmişə yığcamdır: klaviatura açılanda kart
	// yerindən sıçramasın. Planşetdə yalnız görünən hissə həqiqətən alçalanda.
	const COMPACT_BELOW = 240;
	const PHONE_HEIGHT = 500;
	function fitToViewport() {
		const vv = window.visualViewport;
		const h = vv ? vv.height : window.innerHeight;
		root.classList.toggle('compact', h < COMPACT_BELOW
			|| (window.innerWidth > window.innerHeight && window.innerHeight < PHONE_HEIGHT));
		if (!vv) {
			return;
		}
		root.style.left = vv.offsetLeft + 'px';
		root.style.top = vv.offsetTop + 'px';
		root.style.width = vv.width + 'px';
		root.style.height = vv.height + 'px';
	}

	function open(cfg) {
		current = cfg;
		title.textContent = cfg.title || '';
		hint.textContent = cfg.hint || '';
		input.value = cfg.value || '';
		input.placeholder = cfg.placeholder || '';
		input.maxLength = cfg.max > 0 ? cfg.max : 524288;
		input.inputMode = cfg.inputmode || 'text';
		input.setAttribute('autocapitalize', cfg.upper ? 'characters' : 'off');
		// Böyük hərf yalnız GÖRÜNÜR: dəyəri yazı zamanı dəyişmək Android klaviaturalarının
		// söz yığımını (composition) pozur — hərflər təkrarlanır və ya itir. Dəyər göndəriləndə
		// böyüdülür, Godot isə kodu onsuz da normallaşdırır (Social.clean_tag / clean_code).
		input.style.textTransform = cfg.upper ? 'uppercase' : 'none';
		input.setAttribute('enterkeyhint', cfg.enter || 'done');
		ok.textContent = cfg.ok || 'OK';
		root.classList.add('show');
		fitToViewport();
		input.focus();
		try {
			input.setSelectionRange(input.value.length, input.value.length);
		} catch (e) {
			// Bəzi növlərdə (məs. url) seçim dəstəklənmir.
		}
	}

	// GÖNDƏR / Enter — mətn Godot-a gedir. ✕, fona toxunmaq, Esc — LƏĞV: heç nə qaytarılmır,
	// sahə əvvəlki kimi qalır (əvvəl ləğvdə də yazılan mətn tətbiq olunurdu).
	function close(submit) {
		if (!current) {
			return;
		}
		if (submit) {
			const value = current.upper ? input.value.toUpperCase() : input.value;
			result = {key: current.key, value: value, submit: true, at: performance.now()};
		}
		current = null;
		root.classList.remove('show');
		input.blur();
		// Masaüstü klaviaturası yenə oyuna getsin.
		canvas.focus();
	}

	form.addEventListener('submit', (e) => {
		e.preventDefault();
		close(true);
	});
	cancel.addEventListener('click', () => close(false));
	root.addEventListener('pointerdown', (e) => {
		if (e.target === root) {
			close(false);
		}
	});
	input.addEventListener('keydown', (e) => {
		if (e.key === 'Escape') {
			e.preventDefault();
			close(false);
		}
	});

	// ── Kopyala / paylaş — eyni qayda ──────────────────────────────────────
	// iOS panoya yazmağa və paylaşma pəncərəsinə də YALNIZ toxunuşun içində icazə verir.
	// Godot-un `clipboard_set`-i kadr dövründən gəlir: iPhone-da susaraq uğursuz olurdu
	// (mühərrik özü yazır: "only possible from an input callback"), oyun isə "KOPYALANDI"
	// deyirdi; `navigator.share` isə heç nə açmırdı. Düymə basılanda Godot tapşırığı
	// silahlayır (`armAction`), barmaq qalxanda burada icra olunur, nəticə Godot-a qayıdır.
	let armedAction = null;

	// Sinxron yol (`execCommand`) toxunuşun içində iOS-da da işləyir; alınmasa — Clipboard API.
	function copyText(text) {
		let ok = false;
		try {
			const ta = document.createElement('textarea');
			ta.value = text;
			ta.setAttribute('readonly', '');
			ta.style.position = 'fixed';
			ta.style.top = '-1000px';
			ta.style.opacity = '0';
			document.body.appendChild(ta);
			ta.select();
			ta.setSelectionRange(0, text.length);
			ok = document.execCommand('copy');
			ta.remove();
		} catch (e) {
			ok = false;
		}
		canvas.focus();
		if (ok) {
			return Promise.resolve(true);
		}
		if (navigator.clipboard && navigator.clipboard.writeText) {
			return navigator.clipboard.writeText(text).then(() => true, () => false);
		}
		return Promise.resolve(false);
	}

	// Nəticə: {key, value: 'copied' | 'shared' | 'cancelled', submit: alındımı}.
	function runAction(cfg) {
		const finish = (ok, how) => {
			result = {key: cfg.key, value: how, submit: !!ok, at: performance.now()};
		};
		if (cfg.action === 'share' && navigator.share) {
			navigator.share({title: cfg.title || 'Germ Arena', text: cfg.text || '', url: cfg.url || ''})
				.then(() => finish(true, 'shared'), (e) => {
					if (e && e.name === 'AbortError') {
						finish(true, 'cancelled');
					} else {
						copyText(cfg.url || cfg.text || '').then((ok) => finish(ok, 'copied'));
					}
				});
			return;
		}
		const text = cfg.action === 'share' ? (cfg.url || cfg.text || '') : (cfg.text || '');
		copyText(text).then((ok) => finish(ok, 'copied'));
	}

	// Barmaq artıq qalxıbmı (Godot toxunuşu gec emal etdi) və ya toxunuş heç olmayıbmı
	// (iPad-da siçan/trackpad) — onda gözləməyin mənası yoxdur, dərhal icra olunur.
	function noGestureComing(now) {
		return !touchStart || now - touchStart.at > 1000
			|| (liftedAt >= touchStart.at && now - liftedAt < 600);
	}

	canvas.addEventListener('touchstart', (e) => {
		const t = e.changedTouches[0];
		touchStart = {x: t.clientX, y: t.clientY, at: performance.now()};
	}, {capture: true, passive: true});

	canvas.addEventListener('touchend', (e) => {
		const now = performance.now();
		const t = e.changedTouches[0];
		const moved = touchStart ? Math.hypot(t.clientX - touchStart.x, t.clientY - touchStart.y) : 0;
		const tap = moved < TAP_SLOP && e.touches.length === 0;
		if (tap && armed && now - armed.at < ARM_TTL) {
			const cfg = armed.cfg;
			armed = null;
			armedAction = null;
			open(cfg);
			return;
		}
		if (tap && armedAction && now - armedAction.at < ARM_TTL) {
			const cfg = armedAction.cfg;
			armedAction = null;
			armed = null;
			runAction(cfg);
			return;
		}
		// Bu toxunuş açmadı (sürüşdürmə, ikinci barmaq): silah qalmamalıdır — yoxsa sonrakı
		// istənilən toxunuş (məs. OYNA) pəncərəni açardı.
		armed = null;
		armedAction = null;
		liftedAt = now;
	}, {capture: true, passive: true});

	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitToViewport);
		window.visualViewport.addEventListener('scroll', fitToViewport);
	}

	return {
		// Godot: sahəyə toxunuldu. `json` — {key, title, value, placeholder, max, upper, ok, hint, enter, inputmode}.
		arm(json) {
			const cfg = JSON.parse(json);
			const now = performance.now();
			if (current) {
				return;
			}
			if (noGestureComing(now)) {
				armed = null;
				open(cfg);
				return;
			}
			armed = {cfg: cfg, at: now};
		},
		// Godot: kopyala/paylaş düyməsi basıldı. `json` — {key, action: copy|share, text, title, url}.
		armAction(json) {
			const cfg = JSON.parse(json);
			const now = performance.now();
			if (current) {
				return;
			}
			if (noGestureComing(now)) {
				armedAction = null;
				runAction(cfg);
				return;
			}
			armedAction = {cfg: cfg, at: now};
		},
		// Nəticə gözləyən sahənin açarı; yoxdursa boş sətir.
		pending() {
			return result ? result.key : '';
		},
		// Nəticə və onun yaşı (ms) — Godot köhnəsini atır (bax WebText.RESULT_MAX_AGE_MS).
		take() {
			const r = result;
			result = null;
			if (!r) {
				return '';
			}
			r.age = performance.now() - r.at;
			return JSON.stringify(r);
		},
		isOpen() {
			return current !== null;
		},
		// Sahə ekrandan getdi — açıq pəncərəsi də bağlanır (nəticəsiz).
		dismiss(key) {
			if (armed && armed.cfg.key === key) {
				armed = null;
			}
			if (current && current.key === key) {
				current = null;
				root.classList.remove('show');
				input.blur();
			}
		},
	};
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusPrep = document.getElementById('status-prep');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusPrep.style.display = mode === 'prep' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	// Örtük oyunun İLK ekranı çəkiləndə götürülür — oyun bunu özü deyir
	// (bax Settings.web_page_ready). Əvvəl mühərrik işə düşən kimi götürülürdü,
	// zəif telefonda isə ondan sonra menyunun qurulması daha 15+ saniyə çəkir və
	// bu müddətdə ekranda donmuş kətan qalırdı. Oyun xəbər verməsə (xəta), örtük
	// [PREP_FALLBACK_MS] sonra özü götürülür — oyunu əbədi örtməsin.
	const PREP_FALLBACK_MS = 60000;
	window.germHideStatus = function () {
		setStatusMode('hidden');
		fitCanvas();
	};

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Naməlum xəta baş verdi.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Xəta\nBrauzerinizdə oyunu işlətmək üçün lazım olan imkanlar yoxdur:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					// Fayllar gəlib — qalan iş telefonun özündədir.
					if (current >= total) {
						setStatusMode('prep');
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('prep');
			fitCanvas();
			setTimeout(window.germHideStatus, PREP_FALLBACK_MS);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
