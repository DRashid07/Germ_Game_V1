<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- CƏRƏYAN DEŞİYİNİN SABİT BAZASI — kölgə bayırda deyil, yuxarı-sol DAXİLİ
       divardadır; aşağı-sağ daxili divar işıq alır. Bu tərs işıq düzümü mənfi
       hündürlüyü göstərir. Baza fırlanmır ki, Palette.LIGHT_DIR sabit qalsın;
       hərəkət ayrıca mucus_vent_swirl.svg qatındadır. -->
  <defs>
    <radialGradient id="pit" cx="52%" cy="55%" r="62%">
      <stop offset="0%" stop-color="#02080B"/>
      <stop offset="42%" stop-color="#06151A"/>
      <stop offset="72%" stop-color="#14313A"/>
      <stop offset="100%" stop-color="#2B5660" stop-opacity="0.58"/>
    </radialGradient>
    <linearGradient id="rim" x1="20%" y1="15%" x2="82%" y2="90%">
      <stop offset="0%" stop-color="#101A1C"/>
      <stop offset="46%" stop-color="#253F41"/>
      <stop offset="100%" stop-color="#6E6546"/>
    </linearGradient>
    <clipPath id="pitClip"><circle cx="160" cy="160" r="118"/></clipPath>
  </defs>

  <!-- Kəsik kənar bütöv divar haşiyəsinin əksidir: buradan keçmək olar. -->
  <circle cx="160" cy="160" r="118" fill="url(#rim)"/>
  <circle cx="160" cy="160" r="115" fill="none" stroke="#D09345" stroke-width="6" stroke-linecap="round" stroke-dasharray="28 19" opacity="0.88"/>
  <circle cx="160" cy="160" r="96" fill="url(#pit)"/>

  <g clip-path="url(#pitClip)" fill="none" stroke-linecap="round">
    <!-- Yuxarı-sol daxili divar kölgədədir: işıq həmin tərəfdən gəldiyi üçün
         çuxurun divarı işığa arxasını çevirir. -->
    <path d="M82 169 C79 113 113 72 169 65" stroke="#010507" stroke-width="24" opacity="0.92"/>
    <!-- Qarşı daxili divar işıq alır; qalxmış maneədə işıqlı olan tərəfin
         tərsidir və buna görə deşik ilk baxışda içəri batır. -->
    <path d="M238 151 C241 207 207 248 151 255" stroke="#52747A" stroke-width="15" opacity="0.58"/>
    <path d="M230 158 C228 201 201 232 159 240" stroke="#B1843E" stroke-width="5" opacity="0.48"/>
  </g>
  <circle cx="160" cy="160" r="56" fill="#010609" opacity="0.90"/>
  <ellipse cx="145" cy="142" rx="25" ry="18" fill="#000305" opacity="0.72"/>
</svg>
