<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- KÖVRƏK QABIQ — 2 zərbə, son mərhələ. Toqquşma r=120 qalır, lakin üst
       üz üç iri lövhəyə bölünür və iki kənar parçası qopur. Geniş isti yarıqlar
       "bir zərbə qalıb" mesajını ekranın o biri başından verir. -->
  <defs>
    <radialGradient id="castShadow" cx="46%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#020608" stop-opacity="0.50"/>
      <stop offset="60%" stop-color="#020608" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#020608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contactShadow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#020608" stop-opacity="0.47"/>
      <stop offset="68%" stop-color="#020608" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#020608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="24%" y1="18%" x2="78%" y2="100%">
      <stop offset="0%" stop-color="#51442F"/>
      <stop offset="48%" stop-color="#352C24"/>
      <stop offset="100%" stop-color="#171819"/>
    </linearGradient>
    <radialGradient id="top" cx="34%" cy="27%" r="76%">
      <stop offset="0%" stop-color="#7A6B51"/>
      <stop offset="46%" stop-color="#554B3D"/>
      <stop offset="100%" stop-color="#363933"/>
    </radialGradient>
    <clipPath id="bodyClip"><circle cx="160" cy="160" r="120"/></clipPath>
    <clipPath id="topClip"><ellipse cx="151" cy="145" rx="108" ry="106"/></clipPath>
  </defs>
  <ellipse cx="176" cy="192" rx="132" ry="111" fill="url(#castShadow)"/>
  <ellipse cx="171" cy="182" rx="117" ry="101" fill="url(#contactShadow)"/>
  <circle cx="160" cy="160" r="120" fill="url(#side)" stroke="#0A1517" stroke-width="5"/>
  <g clip-path="url(#bodyClip)">
    <path d="M45 154 C62 222 111 272 183 278 C228 282 264 260 282 221 L282 282 L38 282Z" fill="#0A1113" opacity="0.42"/>
    <path d="M52 126 C66 82 103 50 148 41" fill="none" stroke="#93806A" stroke-width="5" stroke-linecap="round" opacity="0.44"/>
  </g>
  <ellipse cx="151" cy="145" rx="108" ry="106" fill="url(#top)" stroke="#87765E" stroke-width="5"/>
  <g clip-path="url(#topClip)">
    <!-- Qopmuş iki iri dişdən altdakı tünd yan üz görünür. -->
    <path d="M235 103 L263 122 L245 144 L260 164 L232 181 L216 154 L227 130Z" fill="#151A19"/>
    <path d="M58 181 L82 191 L73 218 L98 231 L79 252 L48 232 L54 207Z" fill="#151A19"/>
    <!-- İri yarıqlar əvvəl tünd boşluq, sonra isti daxili kənar kimi iki keçiddir. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#111514" stroke-width="17" opacity="0.98">
        <path d="M151 42 L142 86 L165 120 L147 156 L162 224"/>
        <path d="M50 123 L96 116 L142 86"/>
        <path d="M253 146 L199 134 L165 120"/>
        <path d="M82 231 L121 170 L147 156"/>
        <path d="M219 224 L183 176 L147 156"/>
        <path d="M101 59 L117 101 L142 86"/>
        <path d="M204 65 L187 100 L165 120"/>
      </g>
      <g stroke="#F0B94E" stroke-width="7" opacity="1">
        <path d="M146 42 L137 86 L160 120 L142 156 L157 224"/>
        <path d="M50 118 L96 111 L137 86"/>
        <path d="M253 141 L199 129 L160 120"/>
        <path d="M82 226 L121 165 L142 156"/>
        <path d="M219 219 L183 171 L142 156"/>
        <path d="M101 54 L117 96 L137 86"/>
      </g>
      <!-- Dar ağ-sarı nüvə yalnız son mərhələdədir; glow onu uzaqdan götürür. -->
      <g stroke="#FFD778" stroke-width="2.5" opacity="0.78">
        <path d="M146 42 L137 86 L160 120 L142 156 L157 224"/>
        <path d="M50 118 L96 111 L137 86"/>
        <path d="M253 141 L199 129 L160 120"/>
      </g>
    </g>
  </g>
  <path d="M62 141 C67 85 104 48 161 40 C190 36 214 43 232 54" fill="none" stroke="#CBB78F" stroke-width="6" stroke-linecap="round" opacity="0.50"/>
</svg>
