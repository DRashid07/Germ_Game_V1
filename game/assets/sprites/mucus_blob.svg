<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- BİŞMİŞ KÖLGƏ — vahid işıq yuxarı-soldan, kölgə aşağı-sağa.
       Kodda çəkilmirdi, çünki ölçmə göstərdi: hər maneə üçün iki
       `draw_circle` = iki çəkiliş çağırışı, 15 bərk maneə üçün 30 çağırış.
       Teksturada isə PULSUZDUR — sprite onsuz da çəkilir.
       İki qat: yumşaq qat hündürlüyü, sıx kontakt halqası döşəməyə harada
       toxunduğunu deyir. -->
  <g>
    <circle cx="177" cy="187" r="131" fill="#04090B" opacity="0.17"/>
    <circle cx="169" cy="175" r="122" fill="#04090B" opacity="0.34"/>
  </g>
  <g transform="translate(32,32)">
  <!-- Selik ləkəsi (maneə). Radiusu 120-dir (256/2 − 8 haşiyə):
       kodda `scale = radius / 120` ilə hər ölçüyə uyğunlaşdırılır. -->
  <defs>
    <clipPath id="domeClip">
      <circle cx="128" cy="128" r="118"/>
    </clipPath>
    <radialGradient id="mucus" cx="42%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#1D4450"/>
      <stop offset="70%" stop-color="#16333B"/>
      <stop offset="100%" stop-color="#102830"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#mucus)" stroke="#245562" stroke-width="5"/>
  <g fill="#245562" opacity="0.35">
    <circle cx="92" cy="96" r="15"/>
    <circle cx="160" cy="118" r="11"/>
    <circle cx="112" cy="158" r="13"/>
    <circle cx="168" cy="172" r="8"/>
    <circle cx="74" cy="140" r="7"/>
  </g>
  <!-- GÜNBƏZ HƏCMİ. Vahid işıq yuxarı-soldan gəlir (bax ART_BIBLE §2b).
       Üç element: yuxarı-solda rim işığı, aşağı-sağda daxili oklüziya,
       ortada yaş parıltı. HAMISI siluetin İÇİNDƏDİR — siluet toqquşma izidir
       (r=120) və bir piksel də dəyişə bilməz, yoxsa amöb "keçirəm" deyib
       görünməyən kənara dəyər. -->
  <g clip-path="url(#domeClip)">
    <circle cx="176" cy="184" r="116" fill="none" stroke="#07141A" stroke-width="46" opacity="0.40"/>
    <path d="M 44 150 A 98 98 0 0 1 150 44" fill="none" stroke="#5A98A8" stroke-width="8"
          stroke-linecap="round" opacity="0.42"/>
    <ellipse cx="96" cy="86" rx="36" ry="23" fill="#6FB0C0" opacity="0.13"
             transform="rotate(-28 96 86)"/>
  </g>
  </g>
</svg>
